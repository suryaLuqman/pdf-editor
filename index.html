<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>PDF Editor Pro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
                   VARIABEL – Classic Enterprise UI
                   ============================================================ */
        :root {
            --primary-grey: #5A5959;
            --primary-beige: #F3F3E8;
            --accent-gold: #FFB800;
            --border-grey: #D9D9D2;
            --row-hover: #FEE79B;
            --text-main: #2B2B2B;
            --text-header: #000000;
            --toolbar-bg: var(--primary-grey);
            --toolbar-text: #ffffff;
            --accent: var(--accent-gold);
            --accent-hover: #e6a600;
            --danger: #c0392b;
            --page-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
            --border-radius: 8px;
            --font-base: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --toolbar-height: 58px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-base);
            background: var(--primary-beige);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            padding-top: var(--toolbar-height);
        }

        /* ============================================================
                   TOOLBAR – Responsive
                   ============================================================ */
        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--toolbar-bg);
            color: #fff;
            padding: 6px 10px;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 4px 6px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.30);
            height: var(--toolbar-height);
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar {
            display: none;
        }

        #toolbar .toolbar-inner {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 4px 8px;
            flex-shrink: 0;
        }

        #toolbar h1 {
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            color: #fff;
            margin-right: 4px;
            flex-shrink: 0;
        }
        #toolbar h1 span {
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0.7;
            display: inline-block;
            margin-left: 2px;
        }

        .tb-sep {
            width: 1px;
            height: 26px;
            background: rgba(255, 255, 255, 0.20);
            flex-shrink: 0;
            margin: 0 2px;
        }

        .toolbar-group {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 3px 5px;
            flex-shrink: 0;
        }

        .toolbar-group label {
            font-size: 0.6rem;
            white-space: nowrap;
            opacity: 0.8;
            font-weight: 500;
            color: #fff;
            display: none;
        }

        #toolbar button,
        #toolbar select,
        #toolbar input[type="file"],
        #toolbar input[type="text"],
        #toolbar input[type="number"] {
            padding: 4px 8px;
            border: none;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
            background: #fff;
            color: var(--text-main);
            border: 1px solid var(--border-grey);
            height: 30px;
            white-space: nowrap;
        }

        #toolbar button {
            background: var(--accent);
            color: var(--text-header);
            font-weight: 600;
            border: none;
            height: 30px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 0 10px;
        }
        #toolbar button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        #toolbar button:disabled {
            background: #b0a9a9;
            color: #555;
            cursor: not-allowed;
            transform: none !important;
        }
        #toolbar button .btn-icon {
            font-size: 0.9rem;
        }
        #toolbar button .btn-label {
            font-size: 0.65rem;
        }

        #toolbar select {
            background: #fff;
            min-width: 70px;
            cursor: pointer;
            height: 30px;
            font-size: 0.65rem;
            padding: 0 6px;
        }
        #toolbar select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #toolbar input[type="file"] {
            background: rgba(255, 255, 255, 0.10);
            color: #fff;
            border: 1px dashed rgba(255, 255, 255, 0.30);
            padding: 2px 6px;
            max-width: 100px;
            font-size: 0.6rem;
            height: 28px;
        }
        #toolbar input[type="file"]::file-selector-button {
            background: var(--accent);
            color: var(--text-header);
            border: none;
            border-radius: 4px;
            padding: 0 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.6rem;
            height: 24px;
        }

        #toolbar input[type="text"],
        #toolbar input[type="number"] {
            width: 60px;
            padding: 2px 4px;
            font-size: 0.65rem;
            height: 28px;
            background: #fff;
            color: var(--text-main);
            border: 1px solid var(--border-grey);
        }
        #customPages {
            width: 60px;
            display: none;
        }
        #customPages.visible {
            display: inline-block;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.10) !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.20) !important;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.20) !important;
        }
        .btn-danger {
            background: var(--danger) !important;
            color: #fff !important;
            border: none !important;
        }
        .btn-danger:hover {
            background: #a93226 !important;
        }
        .btn-sm {
            padding: 0 6px !important;
            font-size: 0.6rem !important;
            height: 26px !important;
        }
        .btn-icon-only {
            padding: 0 6px !important;
            min-width: 30px !important;
            justify-content: center !important;
        }

        /* Page nav */
        .page-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .page-nav button {
            background: rgba(255, 255, 255, 0.12) !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            padding: 0 6px !important;
            height: 26px !important;
            font-size: 0.7rem !important;
            min-width: 28px;
        }
        .page-nav button:hover {
            background: rgba(255, 255, 255, 0.25) !important;
        }
        .page-nav .page-counter {
            font-size: 0.65rem;
            color: #fff;
            padding: 0 4px;
            min-width: 40px;
            text-align: center;
            font-weight: 500;
        }

        /* Add page dropdown */
        .add-page-group {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .add-page-group .add-page-options {
            display: none;
            position: absolute;
            top: 34px;
            left: 0;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            padding: 6px 0;
            min-width: 160px;
            z-index: 50;
            flex-direction: column;
            border: 1px solid var(--border-grey);
        }
        .add-page-group .add-page-options.open {
            display: flex;
        }
        .add-page-group .add-page-options button {
            background: none !important;
            color: var(--text-main) !important;
            border: none !important;
            padding: 6px 14px !important;
            text-align: left;
            font-weight: 400 !important;
            font-size: 0.75rem !important;
            height: auto !important;
            border-radius: 0 !important;
            width: 100%;
            justify-content: flex-start;
        }
        .add-page-group .add-page-options button:hover {
            background: var(--row-hover) !important;
        }
        .add-page-group .add-page-options .opt-sep {
            height: 1px;
            background: var(--border-grey);
            margin: 4px 10px;
        }
        .add-page-group .add-page-options .opt-label {
            padding: 4px 14px;
            font-size: 0.6rem;
            color: #888;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .add-page-group .add-page-options .orientation-row {
            display: flex;
            gap: 6px;
            padding: 4px 14px 8px;
        }
        .add-page-group .add-page-options .orientation-row button {
            flex: 1;
            text-align: center !important;
            justify-content: center !important;
            background: var(--primary-beige) !important;
            border: 1px solid var(--border-grey) !important;
            border-radius: 4px !important;
            padding: 4px 8px !important;
            font-size: 0.6rem !important;
            color: var(--text-main) !important;
        }
        .add-page-group .add-page-options .orientation-row button.active {
            border-color: var(--accent-gold) !important;
            background: var(--row-hover) !important;
        }

        /* ============================================================
                   DROP ZONE
                   ============================================================ */
        #dropZone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(90, 89, 89, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s;
            backdrop-filter: blur(4px);
        }
        #dropZone.active {
            opacity: 1;
            pointer-events: auto;
        }
        #dropZone .drop-message {
            background: #fff;
            padding: 24px 40px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-header);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.30);
            border: 3px dashed var(--accent-gold);
        }

        /* ============================================================
                   PAGES
                   ============================================================ */
        #pagesContainer {
            width: 100%;
            max-width: 1200px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .page-container {
            position: relative;
            background: #fff;
            box-shadow: var(--page-shadow);
            border-radius: 4px;
            overflow: hidden;
            transition: outline 0.2s, box-shadow 0.2s;
            outline: 3px solid transparent;
            max-width: 100%;
        }
        .page-container.active {
            outline: 3px solid var(--accent-gold);
            box-shadow: 0 4px 20px rgba(255, 184, 0, 0.30);
        }
        .page-container canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        .overlay .object-item {
            pointer-events: auto;
            cursor: move;
            position: absolute;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        .object-item img {
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
        }
        .object-item.selected {
            outline: 2px dashed var(--danger);
            outline-offset: 2px;
        }
        .object-item.text-object {
            cursor: move;
            padding: 2px 4px;
            border-radius: 2px;
            min-width: 20px;
            min-height: 20px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.3;
        }
        .object-item.text-object.selected {
            outline: 2px dashed var(--danger);
            outline-offset: 2px;
        }

        .resize-handle {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #fff;
            border: 2.5px solid var(--danger);
            border-radius: 50%;
            z-index: 10;
            pointer-events: auto;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.20);
        }
        .resize-handle.nw { top: -7px; left: -7px; cursor: nwse-resize; }
        .resize-handle.ne { top: -7px; right: -7px; cursor: nesw-resize; }
        .resize-handle.sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
        .resize-handle.se { bottom: -7px; right: -7px; cursor: nwse-resize; }

        .empty-state {
            text-align: center;
            color: #7f8c8d;
            font-size: 1rem;
            padding: 40px 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            border: 2px dashed var(--border-grey);
        }

        /* ============================================================
                   MODAL TEKS
                   ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(3px);
            padding: 12px;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #fff;
            border-radius: 16px;
            max-width: 680px;
            width: 100%;
            max-height: 94vh;
            overflow-y: auto;
            padding: 20px 22px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.95) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-box h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-header);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-box h2 small {
            font-size: 0.65rem;
            font-weight: 400;
            color: #888;
            margin-left: auto;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover { color: var(--text-header); }
        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
        }
        .modal-grid .full-width { grid-column: 1 / -1; }
        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .modal-field label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .modal-field textarea,
        .modal-field select,
        .modal-field input[type="number"],
        .modal-field input[type="text"] {
            padding: 6px 10px;
            border: 1.5px solid var(--border-grey);
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            transition: border 0.15s;
            background: #fff;
            color: var(--text-main);
            width: 100%;
        }
        .modal-field textarea {
            resize: vertical;
            min-height: 50px;
        }
        .modal-field textarea:focus,
        .modal-field select:focus,
        .modal-field input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(255, 184, 0, 0.15);
        }
        .modal-field .color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .modal-field .color-row input[type="color"] {
            width: 38px;
            height: 38px;
            padding: 2px;
            border-radius: 8px;
            border: 2px solid var(--border-grey);
            cursor: pointer;
            flex-shrink: 0;
        }
        .modal-field .color-row .color-hex {
            font-size: 0.7rem;
            font-family: monospace;
            color: #555;
        }
        .modal-field .color-row .bg-none-btn {
            padding: 2px 12px;
            border: 1.5px solid var(--border-grey);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 500;
            transition: all 0.15s;
            color: var(--text-main);
            height: 28px;
        }
        .modal-field .color-row .bg-none-btn.active {
            border-color: var(--accent-gold);
            background: var(--row-hover);
        }
        .font-upload-area {
            border: 2px dashed var(--border-grey);
            border-radius: 10px;
            padding: 12px 14px;
            background: var(--primary-beige);
        }
        .font-upload-area .upload-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .font-upload-area .upload-row input[type="file"] {
            flex: 1;
            min-width: 100px;
            font-size: 0.65rem;
            padding: 2px 4px;
            border: none;
            background: transparent;
        }
        .font-upload-area .upload-info {
            font-size: 0.6rem;
            color: #777;
            margin-top: 4px;
        }
        .font-upload-area .uploaded-fonts {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        .font-upload-area .uploaded-fonts .font-tag {
            background: #fff;
            border: 1px solid var(--border-grey);
            border-radius: 16px;
            padding: 0 10px;
            font-size: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-main);
            height: 22px;
        }
        .font-upload-area .uploaded-fonts .font-tag .remove-font {
            cursor: pointer;
            color: #999;
            font-weight: 700;
            font-size: 0.7rem;
            line-height: 1;
        }
        .font-upload-area .uploaded-fonts .font-tag .remove-font:hover {
            color: var(--danger);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border-grey);
            flex-wrap: wrap;
        }
        .modal-actions button {
            padding: 6px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .modal-actions .btn-primary {
            background: var(--accent-gold);
            color: var(--text-header);
        }
        .modal-actions .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .modal-actions .btn-secondary {
            background: var(--border-grey);
            color: var(--text-main);
        }
        .modal-actions .btn-secondary:hover {
            background: #cbcbc4;
        }

        /* ============================================================
                   TOAST
                   ============================================================ */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--primary-grey);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.85rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            max-width: 92%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================
                   RESPONSIVE – Mobile First
                   ============================================================ */
        @media (max-width: 820px) {
            :root {
                --toolbar-height: 52px;
            }
            #toolbar {
                padding: 4px 6px;
                gap: 2px 4px;
                height: var(--toolbar-height);
            }
            #toolbar h1 {
                font-size: 0.8rem;
            }
            #toolbar h1 span {
                display: none;
            }
            #toolbar button,
            #toolbar select,
            #toolbar input[type="file"],
            #toolbar input[type="text"],
            #toolbar input[type="number"] {
                font-size: 0.6rem;
                padding: 2px 6px;
                height: 26px;
            }
            #toolbar button .btn-label {
                display: none;
            }
            #toolbar button .btn-icon {
                font-size: 0.9rem;
            }
            #toolbar button.btn-sm {
                padding: 0 4px !important;
                min-width: 26px !important;
                height: 24px !important;
            }
            #toolbar select {
                min-width: 50px;
                font-size: 0.55rem;
                padding: 0 4px;
                height: 24px;
            }
            #toolbar input[type="file"] {
                max-width: 70px;
                font-size: 0.5rem;
                height: 24px;
                padding: 0 4px;
            }
            #toolbar input[type="file"]::file-selector-button {
                font-size: 0.5rem;
                height: 20px;
                padding: 0 6px;
            }
            #toolbar input[type="text"],
            #toolbar input[type="number"] {
                width: 40px;
                font-size: 0.55rem;
                height: 24px;
                padding: 0 3px;
            }
            #customPages {
                width: 40px;
            }
            .tb-sep {
                height: 20px;
                margin: 0 1px;
            }
            .page-nav .page-counter {
                font-size: 0.55rem;
                min-width: 28px;
            }
            .page-nav button {
                height: 24px !important;
                min-width: 24px !important;
                font-size: 0.6rem !important;
                padding: 0 4px !important;
            }
            .add-page-group .add-page-options {
                min-width: 140px;
                left: -20px;
            }
            .add-page-group .add-page-options button {
                font-size: 0.65rem !important;
                padding: 4px 12px !important;
            }
            .modal-box {
                padding: 16px 14px 18px;
                max-width: 100%;
                margin: 8px;
                max-height: 90vh;
            }
            .modal-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .modal-actions {

            #toolbar input[type="text"],

            .tb-sep {

            .page-nav .page-counter {

            }

            .add-page-group .add-page-options {
                min-width: 120px;
                left: -30px;
            }
            .add-page-group .add-page-options button {

            .modal-box {

            .modal-box h2 {

        /* ============================================================

        .modal-box::-webkit-scrollbar { width: 4px; }
        .modal-box::-webkit-scrollbar-track { background: var(--primary-beige); }

        /* ============================================================
                   CONTEXT MENU (layer ordering)

        .context-menu {
            position: fixed;
            background: #fff;

</head>
<body>

    <!-- ============================================================
    LIBRARY
    ============================================================ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // STATE
            // ============================================================
            let pdfDoc = null;
            let pdfBytes = null;
            let pagesData = [];
            let objects = [];
            let selectedObjectId = null;
            let currentPageIndex = 0;
            let isPdfLoaded = false;
            let customFonts = [];
            let clipboardObject = null;
            let pageOrientation = 'portrait'; // 'portrait' | 'landscape'
            let isAddingPage = false;

            // ============================================================
            // DOM REFS
            // ============================================================
            const pdfUploadInput = document.getElementById('pdfUpload');
            const imageInput = document.getElementById('imageInput');
            const addImageBtn = document.getElementById('addImageBtn');
            const addShapeBtn = document.getElementById('addShapeBtn');
            const shapeTypeSelect = document.getElementById('shapeType');
            const addTextBtn = document.getElementById('addTextBtn');
            const applyModeSelect = document.getElementById('applyMode');
            const customPagesInput = document.getElementById('customPages');
            const deleteBtn = document.getElementById('deleteBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const pagesContainer = document.getElementById('pagesContainer');
            const dropZone = document.getElementById('dropZone');
            const pagePrevBtn = document.getElementById('pagePrevBtn');
            const pageNextBtn = document.getElementById('pageNextBtn');
            const pageCounter = document.getElementById('pageCounter');
            const addPageBtn = document.getElementById('addPageBtn');
            const addPageOptions = document.getElementById('addPageOptions');
            const deletePageBtn = document.getElementById('deletePageBtn');
            const bringForwardBtn = document.getElementById('bringForwardBtn');
            const sendBackwardBtn = document.getElementById('sendBackwardBtn');
            const contextMenu = document.getElementById('contextMenu');

            // Modal
            const textModal = document.getElementById('textModal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const modalAddBtn = document.getElementById('modalAddBtn');
            const textContent = document.getElementById('textContent');
            const fontFamilySelect = document.getElementById('fontFamilySelect');
            const fontSizeInput = document.getElementById('fontSizeInput');
            const textColorPicker = document.getElementById('textColorPicker');
            const textColorHex = document.getElementById('textColorHex');
            const bgColorPicker = document.getElementById('bgColorPicker');
            const bgColorHex = document.getElementById('bgColorHex');
            const bgNoneBtn = document.getElementById('bgNoneBtn');
            const fontUploadInput = document.getElementById('fontUploadInput');
            const fontUploadBtn = document.getElementById('fontUploadBtn');
            const uploadedFontsList = document.getElementById('uploadedFontsList');

            // Context menu items
            const cmBringForward = document.getElementById('cmBringForward');
            const cmSendBackward = document.getElementById('cmSendBackward');
            const cmCopy = document.getElementById('cmCopy');
            const cmPaste = document.getElementById('cmPaste');
            const cmDelete = document.getElementById('cmDelete');

            const toastEl = document.getElementById('toast');

            // ============================================================
            // PDF.JS WORKER
            // ============================================================
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            // ============================================================
            // UTILITY
            // ============================================================
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
            }

            function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

            function dataUrlToUint8Array(dataUrl) {
                const base64 = dataUrl.split(',')[1];
                const binary = atob(base64);
                const len = binary.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
                return bytes;
            }

            function getMimeType(dataUrl) {
                return dataUrl.split(';')[0].split(':')[1];
            }

            function hexToRgb(hex) {
                if (!hex || hex === 'none' || hex === 'transparent') return null;
                let h = hex.replace('#', '');
                if (h.length === 3) h = h.split('').map(c => c + c).join('');
                const r = parseInt(h.substring(0, 2), 16) / 255;
                const g = parseInt(h.substring(2, 4), 16) / 255;
                const b = parseInt(h.substring(4, 6), 16) / 255;
                return { r, g, b };
            }

            function getPageAssignments() {
                const mode = applyModeSelect.value;
                if (mode === 'all') return pagesData.map(p => p.pageIndex);
                if (mode === 'current') return [currentPageIndex];
                if (mode === 'custom') {
                    const raw = customPagesInput.value.trim();
                    if (!raw) return [currentPageIndex];
                    const pages = raw.split(',').map(s => parseInt(s.trim()) - 1)
                        .filter(i => !isNaN(i) && i >= 0 && i < pagesData.length);
                    return pages.length > 0 ? pages : [currentPageIndex];
                }
                return [currentPageIndex];
            }

            function showToast(msg, duration) {
                duration = duration || 2800;
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                clearTimeout(toastEl._timer);
                toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
            }

            function showError(msg) { showToast('❌ ' + msg, 3500); }

            function showSuccess(msg) { showToast('✅ ' + msg, 2500); }

            function getPageDimensions(orientation) {
                const w = 595.28,
                    h = 841.89;
                if (orientation === 'landscape') return { width: h, height: w };
                return { width: w, height: h };
            }

            // ============================================================
            // LOAD PDF
            // ============================================================
            async function loadPDF(file) {
                const arrayBuffer = await file.arrayBuffer();
                pdfBytes = arrayBuffer.slice(0);
                const pdfJsBuffer = arrayBuffer.slice(0);

                try {
                    pdfDoc = await pdfjsLib.getDocument({ data: pdfJsBuffer }).promise;
                } catch (err) {
                    showError('Gagal memuat PDF: ' + err.message);
                    return;
                }

                pagesData = [];
                objects = [];
                selectedObjectId = null;
                currentPageIndex = 0;
                pagesContainer.innerHTML = '';

                const totalPages = pdfDoc.numPages;
                for (let i = 0; i < totalPages; i++) {
                    await renderPage(i);
                }

                isPdfLoaded = true;
                updateUIState();
                renderAllObjects();
                updateCurrentPageHighlight();
                updatePageCounter();
                showSuccess('PDF berhasil dimuat (' + totalPages + ' halaman)');
            }

            async function renderPage(pageIndex) {
                const page = await pdfDoc.getPage(pageIndex + 1);
                const viewport1 = page.getViewport({ scale: 1 });
                const pageWidth = viewport1.width;
                const pageHeight = viewport1.height;

                const scale = Math.min(780 / pageWidth, 1000 / pageHeight);
                const scaledViewport = page.getViewport({ scale });

                const container = document.createElement('div');
                container.className = 'page-container';
                container.dataset.pageIndex = pageIndex;
                container.style.width = scaledViewport.width + 'px';
                container.style.height = scaledViewport.height + 'px';
                container.style.flexShrink = '0';

                const canvas = document.createElement('canvas');
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;
                container.appendChild(canvas);

                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;

                const overlay = document.createElement('div');
                overlay.className = 'overlay';
                overlay.style.width = scaledViewport.width + 'px';
                overlay.style.height = scaledViewport.height + 'px';
                container.appendChild(overlay);

                container.addEventListener('click', (e) => {
                    if (e.target === container || e.target === canvas || e.target === overlay) {
                        currentPageIndex = pageIndex;
                        updateCurrentPageHighlight();
                        updatePageCounter();
                        closeContextMenu();
                    }
                });

                // Right click for context menu
                container.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    // Only show if there's a selected object on this page
                    const hasObj = objects.some(o =>
                        o.pageAssignments.includes(pageIndex) && o.id === selectedObjectId
                    );
                    if (selectedObjectId && hasObj) {
                        openContextMenu(e.clientX, e.clientY);
                    }
                });

                pagesContainer.appendChild(container);

                pagesData.push({
                    pageIndex,
                    pageWidth,
                    pageHeight,
                    scale,
                    container,
                    overlay,
                    canvas
                });
            }

            function updateCurrentPageHighlight() {
                pagesData.forEach(p => {
                    p.container.classList.toggle('active', p.pageIndex === currentPageIndex);
                });
            }

            function updatePageCounter() {
                const total = pagesData.length;
                const current = total > 0 ? currentPageIndex + 1 : 0;
                pageCounter.textContent = current + ' / ' + total;
                pagePrevBtn.disabled = !isPdfLoaded || currentPageIndex <= 0;
                pageNextBtn.disabled = !isPdfLoaded || currentPageIndex >= total - 1;
                deletePageBtn.disabled = !isPdfLoaded || total <= 1;
                addPageBtn.disabled = !isPdfLoaded;
            }

            // ============================================================
            // PAGE MANAGEMENT
            // ============================================================
            async function addPage(where, orientation) {
                if (!isPdfLoaded || !pdfBytes) {
                    showError('PDF belum dimuat.');
                    return;
                }
                orientation = orientation || pageOrientation;
                const dims = getPageDimensions(orientation);

                try {
                    // Load pdf-lib document
                    const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
                    const totalPages = pdfLibDoc.getPages().length;

                    let insertIndex;
                    if (where === 'before') {
                        insertIndex = currentPageIndex;
                    } else if (where === 'after') {
                        insertIndex = currentPageIndex + 1;
                    } else { // 'end'
                        insertIndex = totalPages;
                    }
                    insertIndex = Math.max(0, Math.min(insertIndex, totalPages));

                    // Insert blank page
                    pdfLibDoc.insertPage(insertIndex, [dims.width, dims.height]);

                    const newBytes = await pdfLibDoc.save();
                    pdfBytes = newBytes;

                    // Reload PDF
                    const pdfJsBuffer = newBytes.slice(0);
                    pdfDoc = await pdfjsLib.getDocument({ data: pdfJsBuffer }).promise;

                    // Re-render all pages
                    const oldPagesData = pagesData;
                    pagesData = [];
                    objects = [];
                    selectedObjectId = null;
                    pagesContainer.innerHTML = '';

                    const totalPagesNew = pdfDoc.numPages;
                    for (let i = 0; i < totalPagesNew; i++) {
                        await renderPage(i);
                    }

                    // Update current page index
                    if (where === 'before') {
                        currentPageIndex = insertIndex;
                    } else if (where === 'after') {
                        currentPageIndex = insertIndex;
                    } else {
                        currentPageIndex = totalPagesNew - 1;
                    }
                    // Adjust if out of bounds
                    currentPageIndex = Math.max(0, Math.min(currentPageIndex, pagesData.length - 1));

                    isPdfLoaded = true;
                    updateUIState();
                    renderAllObjects();
                    updateCurrentPageHighlight();
                    updatePageCounter();
                    showSuccess('Halaman ' + (where === 'before' ? 'sebelum' : where === 'after' ? 'setelah' : 'di akhir') +
                        ' ditambahkan!');

                } catch (err) {
                    console.error(err);
                    showError('Gagal menambah halaman: ' + err.message);
                }
            }

            async function deleteCurrentPage() {
                if (!isPdfLoaded || !pdfBytes || pagesData.length <= 1) {
                    showError('Tidak bisa menghapus halaman terakhir.');
                    return;
                }

                try {
                    const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
                    const totalPages = pdfLibDoc.getPages().length;
                    if (totalPages <= 1) {
                        showError('Minimal 1 halaman.');
                        return;
                    }
                    const idx = Math.min(currentPageIndex, totalPages - 1);
                    pdfLibDoc.removePage(idx);

                    const newBytes = await pdfLibDoc.save();
                    pdfBytes = newBytes;

                    const pdfJsBuffer = newBytes.slice(0);
                    pdfDoc = await pdfjsLib.getDocument({ data: pdfJsBuffer }).promise;

                    const oldPagesData = pagesData;
                    pagesData = [];
                    objects = [];
                    selectedObjectId = null;
                    pagesContainer.innerHTML = '';

                    const totalPagesNew = pdfDoc.numPages;
                    for (let i = 0; i < totalPagesNew; i++) {
                        await renderPage(i);
                    }

                    currentPageIndex = Math.max(0, Math.min(idx, totalPagesNew - 1));

                    isPdfLoaded = true;
                    updateUIState();
                    renderAllObjects();
                    updateCurrentPageHighlight();
                    updatePageCounter();
                    showSuccess('Halaman dihapus!');

                } catch (err) {
                    console.error(err);
                    showError('Gagal menghapus halaman: ' + err.message);
                }
            }

            function goToPage(index) {
                if (index < 0 || index >= pagesData.length) return;
                currentPageIndex = index;
                updateCurrentPageHighlight();
                updatePageCounter();
                // Scroll to page
                const container = pagesData[index].container;
                if (container) {
                    container.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            // ============================================================
            // OBJECT MANAGEMENT
            // ============================================================
            function createObject(type, data) {
                data = data || {};
                const obj = {
                    id: generateId(),
                    type: type,
                    x: data.x ?? 100,
                    y: data.y ?? 100,
                    width: data.width ?? 200,
                    height: data.height ?? 150,
                    pageAssignments: data.pageAssignments ?? getPageAssignments(),
                    src: data.src || null,
                    fillColor: data.fillColor || '#FFB800',
                    strokeColor: data.strokeColor || '#2B2B2B',
                    strokeWidth: data.strokeWidth ?? 2,
                    textContent: data.textContent || '',
                    fontFamily: data.fontFamily || 'Arial',
                    fontSize: data.fontSize || 28,
                    textColor: data.textColor || '#2B2B2B',
                    bgColor: data.bgColor || 'transparent',
                    zIndex: data.zIndex ?? objects.length,
                };
                objects.push(obj);
                renderAllObjects();
                selectObject(obj.id);
                return obj;
            }

            function deleteObject(objId) {
                objects = objects.filter(o => o.id !== objId);
                if (selectedObjectId === objId) selectedObjectId = null;
                renderAllObjects();
                updateUIState();
                closeContextMenu();
            }

            function selectObject(objId) {
                selectedObjectId = objId;
                updateSelection();
                updateUIState();
            }

            function updateSelection() {
                document.querySelectorAll('.object-item.selected').forEach(el => {
                    el.classList.remove('selected');
                    el.querySelectorAll('.resize-handle').forEach(h => h.remove());
                });

                if (!selectedObjectId) return;

                document.querySelectorAll(`.object-item[data-object-id="${selectedObjectId}"]`).forEach(el => {
                    el.classList.add('selected');
                    addResizeHandles(el);
                });
            }

            function addResizeHandles(el) {
                const positions = ['nw', 'ne', 'sw', 'se'];
                positions.forEach(pos => {
                    const handle = document.createElement('div');
                    handle.className = 'resize-handle ' + pos;
                    handle.dataset.handlePos = pos;
                    handle.addEventListener('mousedown', (e) => onResizeHandleMouseDown(e, selectedObjectId, pos));
                    el.appendChild(handle);
                });
            }

            function getObjectById(id) {
                return objects.find(o => o.id === id);
            }

            // ============================================================
            // LAYER ORDERING
            // ============================================================
            function bringForward() {
                if (!selectedObjectId) return;
                const obj = getObjectById(selectedObjectId);
                if (!obj) return;
                const idx = objects.indexOf(obj);
                if (idx < objects.length - 1) {
                    objects.splice(idx, 1);
                    objects.splice(idx + 1, 0, obj);
                    renderAllObjects();
                    selectObject(obj.id);
                    showSuccess('Objek dibawa ke depan');
                }
            }

            function sendBackward() {
                if (!selectedObjectId) return;
                const obj = getObjectById(selectedObjectId);
                if (!obj) return;
                const idx = objects.indexOf(obj);
                if (idx > 0) {
                    objects.splice(idx, 1);
                    objects.splice(idx - 1, 0, obj);
                    renderAllObjects();
                    selectObject(obj.id);
                    showSuccess('Objek dikirim ke belakang');
                }
            }

            // ============================================================
            // COPY / PASTE
            // ============================================================
            function copyObject() {
                if (!selectedObjectId) {
                    showError('Pilih objek terlebih dahulu.');
                    return;
                }
                const obj = getObjectById(selectedObjectId);
                if (!obj) return;
                // Deep clone
                clipboardObject = JSON.parse(JSON.stringify(obj));
                clipboardObject.id = generateId();
                clipboardObject.x += 20;
                clipboardObject.y += 20;
                showSuccess('Objek disalin');
            }

            function pasteObject() {
                if (!clipboardObject) {
                    showError('Tidak ada objek di clipboard.');
                    return;
                }
                const newObj = JSON.parse(JSON.stringify(clipboardObject));
                newObj.id = generateId();
                newObj.pageAssignments = getPageAssignments();
                // Offset
                newObj.x += 10;
                newObj.y += 10;
                objects.push(newObj);
                renderAllObjects();
                selectObject(newObj.id);
                showSuccess('Objek ditempel');
            }

            // ============================================================
            // RENDER OBJEK
            // ============================================================
            function createObjectElement(obj, scale) {
                const el = document.createElement('div');
                el.className = 'object-item';
                if (obj.type === 'text') el.classList.add('text-object');
                el.dataset.objectId = obj.id;
                el.style.left = (obj.x * scale) + 'px';
                el.style.top = (obj.y * scale) + 'px';
                el.style.width = (obj.width * scale) + 'px';
                el.style.height = (obj.height * scale) + 'px';
                el.style.position = 'absolute';
                el.style.cursor = 'move';
                el.style.boxSizing = 'border-box';
                el.style.overflow = 'hidden';
                el.style.zIndex = obj.zIndex || 0;

                if (obj.type === 'image') {
                    const img = document.createElement('img');
                    img.src = obj.src;
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.pointerEvents = 'none';
                    img.draggable = false;
                    el.appendChild(img);
                } else if (obj.type === 'text') {
                    const textDiv = document.createElement('div');
                    textDiv.style.width = '100%';
                    textDiv.style.height = '100%';
                    textDiv.style.padding = '3px 5px';
                    textDiv.style.boxSizing = 'border-box';
                    textDiv.style.overflow = 'hidden';
                    textDiv.style.wordBreak = 'break-word';
                    textDiv.style.whiteSpace = 'pre-wrap';
                    textDiv.style.lineHeight = '1.3';
                    textDiv.style.fontFamily = obj.fontFamily || 'Arial';
                    textDiv.style.fontSize = (obj.fontSize * scale) + 'px';
                    textDiv.style.color = obj.textColor || '#2B2B2B';
                    if (obj.bgColor && obj.bgColor !== 'transparent' && obj.bgColor !== 'none') {
                        textDiv.style.backgroundColor = obj.bgColor;
                    } else {
                        textDiv.style.backgroundColor = 'transparent';
                    }
                    textDiv.textContent = obj.textContent || 'Teks';
                    el.appendChild(textDiv);
                    el._textDiv = textDiv;

                    el.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        openEditTextModal(obj.id);
                    });

                } else {
                    // Shape: SVG
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('width', '100%');
                    svg.setAttribute('height', '100%');
                    svg.setAttribute('viewBox', '0 0 100 100');
                    svg.setAttribute('preserveAspectRatio', 'none');
                    svg.style.display = 'block';

                    const sw = obj.strokeWidth * scale;
                    const fill = obj.fillColor || 'none';
                    const stroke = obj.strokeColor || 'none';

                    let shapeEl;
                    switch (obj.type) {
                        case 'rect':
                        case 'square':
                            shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                            shapeEl.setAttribute('x', '0');
                            shapeEl.setAttribute('y', '0');
                            shapeEl.setAttribute('width', '100');
                            shapeEl.setAttribute('height', '100');
                            break;
                        case 'ellipse':
                            shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                            shapeEl.setAttribute('cx', '50');
                            shapeEl.setAttribute('cy', '50');
                            shapeEl.setAttribute('rx', '50');
                            shapeEl.setAttribute('ry', '50');
                            break;
                        case 'triangle':
                            shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                            shapeEl.setAttribute('points', '50,5 95,95 5,95');
                            break;
                        case 'line':
                            shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            shapeEl.setAttribute('x1', '0');
                            shapeEl.setAttribute('y1', '100');
                            shapeEl.setAttribute('x2', '100');
                            shapeEl.setAttribute('y2', '0');
                            break;
                    }
                    shapeEl.setAttribute('fill', fill);
                    shapeEl.setAttribute('stroke', stroke);
                    shapeEl.setAttribute('stroke-width', sw);
                    shapeEl.setAttribute('vector-effect', 'non-scaling-stroke');
                    svg.appendChild(shapeEl);
                    el.appendChild(svg);
                    el._shapeElement = shapeEl;
                }

                el.addEventListener('mousedown', (e) => onObjectMouseDown(e, obj.id));
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectObject(obj.id);
                    closeContextMenu();
                });
                el.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    selectObject(obj.id);
                    openContextMenu(e.clientX, e.clientY);
                });

                return el;
            }

            function renderAllObjects() {
                pagesData.forEach(page => {
                    page.overlay.innerHTML = '';
                });

                // Sort by zIndex
                const sorted = [...objects].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));

                sorted.forEach(obj => {
                    obj.pageAssignments.forEach(pageIndex => {
                        const page = pagesData.find(p => p.pageIndex === pageIndex);
                        if (!page) return;
                        const el = createObjectElement(obj, page.scale);
                        page.overlay.appendChild(el);
                    });
                });

                if (selectedObjectId) {
                    updateSelection();
                }
            }

            function updateObjectElements(obj) {
                pagesData.forEach(page => {
                    const elements = page.overlay.querySelectorAll(`.object-item[data-object-id="${obj.id}"]`);
                    elements.forEach(el => {
                        el.style.left = (obj.x * page.scale) + 'px';
                        el.style.top = (obj.y * page.scale) + 'px';
                        el.style.width = (obj.width * page.scale) + 'px';
                        el.style.height = (obj.height * page.scale) + 'px';
                        el.style.zIndex = obj.zIndex || 0;

                        if (obj.type === 'text' && el._textDiv) {
                            el._textDiv.style.fontSize = (obj.fontSize * page.scale) + 'px';
                            el._textDiv.style.fontFamily = obj.fontFamily || 'Arial';
                            el._textDiv.style.color = obj.textColor || '#2B2B2B';
                            if (obj.bgColor && obj.bgColor !== 'transparent' && obj.bgColor !== 'none') {
                                el._textDiv.style.backgroundColor = obj.bgColor;
                            } else {
                                el._textDiv.style.backgroundColor = 'transparent';
                            }
                            el._textDiv.textContent = obj.textContent || 'Teks';
                        }

                        if (obj.type !== 'text' && obj.type !== 'image' && el._shapeElement) {
                            el._shapeElement.setAttribute('fill', obj.fillColor || 'none');
                            el._shapeElement.setAttribute('stroke', obj.strokeColor || 'none');
                            el._shapeElement.setAttribute('stroke-width', obj.strokeWidth * page.scale);
                        }
                        if (obj.type === 'image' && el.querySelector('img')) {
                            el.querySelector('img').src = obj.src;
                        }
                    });
                });
            }

            // ============================================================
            // MOUSE INTERACTIONS
            // ============================================================
            function onObjectMouseDown(e, objId) {
                e.preventDefault();
                e.stopPropagation();
                selectObject(objId);
                const obj = getObjectById(objId);
                if (!obj) return;

                const overlay = e.target.closest('.overlay');
                const page = pagesData.find(p => p.overlay === overlay);
                if (!page) return;

                const scale = page.scale;
                const startMX = e.clientX;
                const startMY = e.clientY;
                const startX = obj.x;
                const startY = obj.y;

                function onMove(ev) {
                    const dx = (ev.clientX - startMX) / scale;
                    const dy = (ev.clientY - startMY) / scale;
                    obj.x = clamp(startX + dx, 0, page.pageWidth - obj.width);
                    obj.y = clamp(startY + dy, 0, page.pageHeight - obj.height);
                    updateObjectElements(obj);
                }

                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            }

            function onResizeHandleMouseDown(e, objId, pos) {
                e.preventDefault();
                e.stopPropagation();
                selectedObjectId = objId;
                const obj = getObjectById(objId);
                if (!obj) return;

                const overlay = e.target.closest('.overlay');
                const page = pagesData.find(p => p.overlay === overlay);
                if (!page) return;

                const scale = page.scale;
                const startMX = e.clientX;
                const startMY = e.clientY;
                const startX = obj.x;
                const startY = obj.y;
                const startW = obj.width;
                const startH = obj.height;

                function onMove(ev) {
                    const dx = (ev.clientX - startMX) / scale;
                    const dy = (ev.clientY - startMY) / scale;

                    let newX = startX,
                        newY = startY,
                        newW = startW,
                        newH = startH;

                    if (pos.includes('e')) newW = Math.max(10, startW + dx);
                    if (pos.includes('s')) newH = Math.max(10, startH + dy);
                    if (pos.includes('w')) {
                        newW = Math.max(10, startW - dx);
                        newX = startX + dx;
                    }
                    if (pos.includes('n')) {
                        newH = Math.max(10, startH - dy);
                        newY = startY + dy;
                    }

                    newX = clamp(newX, 0, page.pageWidth - newW);
                    newY = clamp(newY, 0, page.pageHeight - newH);

                    obj.x = newX;
                    obj.y = newY;
                    obj.width = newW;
                    obj.height = newH;
                    updateObjectElements(obj);
                }

                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    updateSelection();
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            }

            // ============================================================
            // CONTEXT MENU
            // ============================================================
            function openContextMenu(x, y) {
                contextMenu.style.left = x + 'px';
                contextMenu.style.top = y + 'px';
                contextMenu.classList.add('open');
                // Prevent overflow
                const rect = contextMenu.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    contextMenu.style.left = (x - rect.width) + 'px';
                }
                if (rect.bottom > window.innerHeight) {
                    contextMenu.style.top = (y - rect.height) + 'px';
                }
            }

            function closeContextMenu() {
                contextMenu.classList.remove('open');
            }

            document.addEventListener('click', (e) => {
                if (!contextMenu.contains(e.target)) {
                    closeContextMenu();
                }
            });

            // Context menu actions
            cmBringForward.addEventListener('click', () => { bringForward();
                closeContextMenu(); });
            cmSendBackward.addEventListener('click', () => { sendBackward();
                closeContextMenu(); });
            cmCopy.addEventListener('click', () => { copyObject();
                closeContextMenu(); });
            cmPaste.addEventListener('click', () => { pasteObject();
                closeContextMenu(); });

                fontSizeInput.value = 28;

            function openEditTextModal(objId) {
                const obj = getObjectById(objId);
                if (!obj || obj.type !== 'text') return;
                editingTextId = objId;
                textContent.value = obj.textContent || '';
                fontSizeInput.value = obj.fontSize || 28;
                textColorPicker.value = obj.textColor || '#2B2B2B';
                textColorHex.textContent = obj.textColor || '#2B2B2B';
                const bg = obj.bgColor || 'transparent';
                if (bg === 'transparent' || bg === 'none') {
                    bgColorPicker.value = '#F3F3E8';
                    bgColorHex.textContent = '#F3F3E8';
                    bgNoneBtn.classList.add('active');
                } else {

                textModal.classList.add('active');
                textContent.focus();
                textContent.select();
